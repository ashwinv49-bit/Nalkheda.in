name: Deploy Aansh Collection to Netlify

on:
  push:
    branches:
      - claude/aansh-collection-ecommerce-KRckE
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ''

      - name: Deploy to Netlify
        run: |
          npm install -g netlify-cli
          netlify deploy --dir=out --prod --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN
        env:
          NETLIFY_AUTH_TOKEN: nfp_1emqxLvbTGAZJR96pXtvr5kmA8CjAWt79276
          NETLIFY_SITE_ID: e9ea0616-1fa6-4346-bf48-5fc2a048dc90
