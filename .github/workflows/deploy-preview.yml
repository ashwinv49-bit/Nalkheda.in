name: Deploy Aansh Collection — GitHub Pages

on:
  push:
    branches:
      - claude/aansh-collection-ecommerce-KRckE
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production
          # Set to /aansh-collection for GitHub Pages subdirectory deploy.
          # Remove this line if you have a custom domain (e.g. aanshcollection.in).
          NEXT_PUBLIC_BASE_PATH: /aansh-collection

      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.sha }}"
          force_orphan: true
