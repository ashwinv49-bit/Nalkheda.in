name: SEO Performance Review Reminder

on:
  schedule:
    # Runs every 15 days: 1st and 16th of each month at 9 AM IST (3:30 AM UTC)
    - cron: '30 3 1 * *'
    - cron: '30 3 16 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  create-review-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create SEO Review Issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const nextReview = new Date(Date.now() + 15 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 SEO Review — ${today}`,
              labels: ['seo-review'],
              body: `## 15-Day SEO Performance Review

**Review Date:** ${today}
**Next Review:** ${nextReview}

---

### Step 1 — Export Fresh Search Console Data
1. Go to [Google Search Console](https://search.google.com/search-console) → nalkheda.in
2. Click **Performance** → Last 28 days
3. Export as Excel/CSV
4. Share the file in this issue or with Claude Code

### Step 2 — Check These Key Metrics

| Metric | Target | Action if Below |
|--------|--------|-----------------|
| Homepage CTR | >2% | Update meta description |
| Avg Position | <12 | Check which queries dropped |
| Indexed Pages | 21 | Submit sitemap again |
| Mobile impressions | >60% | Check mobile UX |

### Step 3 — Queries to Monitor (from last report)

**Near Page 1 — must push to top 3:**
- \`nalkheda nadi name\` — was position 4.6 (target: #1)
- \`nearest airport to nalkheda\` — was position 10.5 (target: top 5)
- \`nalkheda nearest railway station\` — was position 17.3 (target: top 10)
- \`nal kheda\` — was position 13.72, 40 impressions (target: top 5)
- \`nalkheda baglamukhi temple timings\` — was position 11.5 (target: top 5)
- \`dharamshala near baglamukhi temple nalkheda\` — was position 11.0 (target: top 5)
- \`hotels near baglamukhi temple nalkheda\` — was position 15.0 (target: top 5)

### Step 4 — Check Pages Indexed
Go to Search Console → **Pages** → Not Indexed
All these must be indexed:
- [ ] https://nalkheda.in/
- [ ] https://nalkheda.in/temple-timings.html
- [ ] https://nalkheda.in/how-to-reach.html
- [ ] https://nalkheda.in/hotels.html
- [ ] https://nalkheda.in/travel-guide.html
- [ ] https://nalkheda.in/faq.html
- [ ] https://nalkheda.in/blog/ (and all 10 blog posts)

### Step 5 — Quick Wins Checklist
- [ ] Compress maa-darshan.jpg (currently 5.6MB → target <200KB)
- [ ] Submit sitemap to Google if new pages added
- [ ] Check for any new 0-click queries with <15 position → add to FAQ schema
- [ ] Verify hawan booking link still works (mabaglamukhi.com)

---
*Auto-generated by GitHub Actions. Close this issue after completing the review.*`
            });

            console.log('SEO review issue created successfully');
